# .github/workflows/csaf-pages.yml
#
# Phase 2 (cisagov/CSAF#457): serve the provider from GitHub Pages with
# csaf-tools/csaf-action instead of raw.githubusercontent.com.
#
# The action rebuilds .well-known/csaf/ on the gh-pages branch from every
# advisory in csaf_files/, using the .asc signatures already committed next to
# each file (openpgp_use_signatures: true), so the private key never leaves
# the ingest workflow. It validates (schema + Secvisogram mandatory tests),
# writes hashes, index.txt, changes.csv, ROLIE feeds and provider-metadata.json.
#
# BEFORE enabling the push trigger, see the cutover checklist in the README:
# the three ROLIE feed files (cisa-csaf-*-feed-tlp-white.json) must be moved
# out of csaf_files/, or the action will try to upload them as advisories.

name: Publish CSAF to GitHub Pages

on:
  workflow_dispatch:
  # Enable at cutover:
  # push:
  #   branches: [develop]
  #   paths:
  #     - 'csaf_files/**.json'
  #     - 'csaf_files/**.asc'

concurrency:
  group: csaf-pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 180          # full rebuild of ~4,100 advisories each run
    steps:
      - name: Publish CSAF advisories
        # Pinned: the action says it is not stable yet. v0.4.0 = c0222e196ec76a9a10b4cdf86da33e468cd2b59a
        uses: csaf-tools/csaf-action@v0.4.0
        with:
          csaf_version: "3.6.0"
          secvisogram_version: "3.0.2"
          source_csaf_documents: csaf_files/
          publisher_category: ${{ vars.CSAF_PUBLISHER_CATEGORY || 'other' }}
          publisher_name: ${{ vars.CSAF_PUBLISHER_NAME || 'CISA' }}
          publisher_namespace: ${{ vars.CSAF_PUBLISHER_NAMESPACE || 'https://www.cisa.gov/' }}
          publisher_issuing_authority: ${{ vars.CSAF_PUBLISHER_ISSUING_AUTHORITY }}
          publisher_contact_details: ${{ vars.CSAF_PUBLISHER_CONTACT_DETAILS || 'central@cisa.dhs.gov' }}
          openpgp_use_signatures: true
          openpgp_public_key: ${{ vars.CSAF_OPENPGP_PUBLIC_KEY }}
          tlps: csaf,white
          generate_index_files: true
          html_title: CISA CSAF Advisories
