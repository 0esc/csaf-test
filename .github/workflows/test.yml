# .github/workflows/test.yml
#
# test:      runs the local test suite (scripts/test_publish.py) whenever the
#            publishing scripts or workflows change. Uses a throwaway GPG key
#            and a temp copy of the repo: no secrets, nothing published.
# check-pr:  on every pull request that touches incoming/ or csaf_files/,
#            validates the advisories it adds or changes, checks every
#            advisory's placement and .sha512, and rejects edits to the
#            generated feed files. Make this a required check on develop.

name: Test CSAF tooling

on:
  pull_request:
    paths:
      - "scripts/**"
      - "incoming/**"
      - "csaf_files/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"
  push:
    branches: [develop]
    paths:
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install validator (pinned in package-lock.json)
        run: npm ci --no-audit --no-fund

      - name: Check Python scripts compile
        run: python3 -m py_compile scripts/*.py

      - name: Run publish tests
        run: python3 scripts/test_publish.py

  check-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install validator (pinned in package-lock.json)
        run: npm ci --no-audit --no-fund

      - name: Check advisories in this PR
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: python3 scripts/ingest.py check-pr
