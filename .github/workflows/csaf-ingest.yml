# .github/workflows/csaf-ingest.yml
#
# Each step runs one subcommand of scripts/ingest.py.
#
# Replaces the SSH "black box": coordinator JSON -> validate -> sign -> hash
# -> place in csaf_files/<FEED>/white/<year>/ -> one pull request per
# advisory (or a direct push) to develop.
#
# The shared files (index.txt, changes.csv, ROLIE feed, CHANGELOG.md) are NOT
# touched here. csaf-feeds.yml rebuilds them after every merge, so any number
# of advisory PRs from any number of people can be open at once and merged in
# any order without conflicts.
#
# Ways an advisory gets in (all take the same path):
#   1. repository_dispatch from the coordination platform:
#        POST /repos/<owner>/<repo>/dispatches
#        {"event_type":"csaf-advisory","client_payload":{"url":"https://...","feed":"OT"}}
#   2. workflow_dispatch: someone pastes the URL in the Actions tab
#   3. push: commit the raw JSON to incoming/<FEED>/  (incoming/OT/foo.json)
#      or to incoming/ (feed auto-detected: ICSA-/ICSMA- -> OT, VA- -> IT)

name: Ingest CSAF advisory

on:
  repository_dispatch:
    types: [csaf-advisory]
  workflow_dispatch:
    inputs:
      url:
        description: "URL of the CSAF JSON on the coordination platform (blank = process incoming/)"
        required: false
      feed:
        description: "Feed for a URL import"
        type: choice
        options: [auto, OT, IT, VA]
        default: auto
  push:
    branches: [develop]
    paths: ["incoming/**.json"]

# No workflow-wide concurrency group: GitHub keeps only ONE pending run per
# group and cancels the rest, which would silently drop advisories when several
# arrive together. Runs don't share files any more, so they can run in parallel.

permissions:
  contents: read

env:
  BASE_BRANCH: develop

jobs:
  # ---- 1. Get the file(s) and validate them. No signing key in this job. -----
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      count: ${{ steps.files.outputs.count }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.BASE_BRANCH }}

      - name: Fetch advisory from coordinator
        if: github.event_name != 'push' && (github.event.client_payload.url || inputs.url)
        env:
          SRC_URL: ${{ github.event.client_payload.url || inputs.url }}
          FEED: ${{ github.event.client_payload.feed || inputs.feed || 'auto' }}
          COORDINATOR_HOST: ${{ vars.COORDINATOR_HOST }}
          COORDINATOR_TOKEN: ${{ secrets.COORDINATOR_TOKEN }}   # repository secret, not environment
        run: python3 scripts/ingest.py fetch

      - name: Collect incoming files
        id: files
        run: python3 scripts/ingest.py collect

      - uses: actions/setup-node@v6
        if: steps.files.outputs.count != '0'
        with:
          node-version: 22

      - name: Install validator (pinned in package-lock.json)
        if: steps.files.outputs.count != '0'
        run: npm ci --no-audit --no-fund

      # Schema + every CSAF 2.0 mandatory test (6.1.x), in-process.
      - name: Validate
        if: steps.files.outputs.count != '0'
        run: python3 scripts/ingest.py validate

      # Hand exactly the validated files to the signing job, so a file pushed to
      # incoming/ in the meantime can't be signed without being validated.
      - name: Hand validated files to the publish job
        if: steps.files.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: validated-incoming
          path: incoming/   # whole folder, so incoming/<FEED>/ sub-folders survive the round trip
          retention-days: 1
          if-no-files-found: error

  # ---- 2. Sign, hash, place, open PR(s). Only runs when there is something to
  # publish, so reviewers on the environment are never asked to approve no-ops.
  publish:
    needs: prepare
    if: needs.prepare.outputs.count != '0'
    runs-on: ubuntu-24.04
    environment: csaf-publishing   # holds the signing key; add reviewers here for a manual gate
    permissions:
      contents: write
      pull-requests: write
      actions: write               # push mode dispatches csaf-feeds.yml
    env:
      PUBLISH_MODE: ${{ vars.CSAF_PUBLISH_MODE || 'pr' }}   # "pr" or "push"
    steps:
      # Optional GitHub App token (see CSAF-AUTOMATION.md). Needed for PR checks to
      # run on the bot's PRs, and for push mode on a protected develop branch.
      - name: GitHub App token
        id: app
        if: vars.CSAF_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CSAF_APP_ID }}
          private-key: ${{ secrets.CSAF_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          ref: ${{ env.BASE_BRANCH }}
          token: ${{ steps.app.outputs.token || github.token }}

      - name: Replace incoming/ with the validated files
        run: find incoming -name '*.json' -type f -delete

      - uses: actions/download-artifact@v4
        with:
          name: validated-incoming
          path: incoming

      - name: Import OpenPGP signing key
        id: gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.CSAF_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.CSAF_GPG_PASSPHRASE }}

      - name: Sign and place advisories
        env:
          GPG_KEY_ID: ${{ steps.gpg.outputs.fingerprint }}
        run: python3 scripts/ingest.py publish

      - name: Open one PR per advisory / push
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: python3 scripts/ingest.py commit
